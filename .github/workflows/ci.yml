name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Default to read-only; individual jobs opt into anything more.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Active LTS lines only (verified against nodejs.org's release
        # schedule on 2026-08-23): 18 went EOL 2025-03-27, 20 went EOL
        # 2026-03-24. Testing against either would mean testing against a
        # Node line that no longer receives security patches at all, which
        # this project - itself a security-integrity library - does not
        # treat as a defensible baseline. See docs/COMPATIBILITY.md.
        node-version: ["22", "24"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install pnpm
      uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm run typecheck

    - name: Lint
      run: pnpm run lint --max-warnings=0

    - name: Run Tests
      run: pnpm run test

    - name: Build
      run: pnpm run build

    - name: Run end-to-end example (Anthropic)
      run: pnpm run example:anthropic

    - name: Run end-to-end example (AI SDK execution gate)
      run: pnpm run example:ai-sdk

    - name: Run end-to-end example (AI SDK execution guard)
      run: pnpm run example:ai-sdk-guard

    - name: Run golden AI SDK ownership-boundary example
      run: pnpm run example:ai-sdk-safe-boundary

    - name: Pack Check
      run: pnpm run pack:check

  # Split out from build-and-test's 9-leg matrix rather than run there:
  # v8 coverage instrumentation on 9 legs bought no meaningful extra signal
  # over one representative run - the source under test has no
  # platform-conditional branches that would make per-OS coverage numbers
  # differ - and multiplied the instrumented-run cost ninefold for nothing.
  # Coverage stays a required PR/push gate; it just runs once.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate corpus metadata and structure
        run: pnpm run validate-corpus

      - name: Run Tests (with coverage)
        run: pnpm run test:coverage

  # `pack:check` above (`pnpm pack --dry-run`) only proves what WOULD be
  # packed - it never actually installs the tarball anywhere. This job packs
  # for real and installs that exact tarball into an isolated scratch
  # project, matching what a real `npm install prefix-safe-json` consumer
  # gets - not source, not a workspace symlink. Previously this only
  # happened in publish.yml's own release path (so a packaging regression
  # was only caught the moment a release was already being attempted);
  # every PR now gets the same signal. One Node version only (this tests
  # packaging mechanics, not per-platform runtime behavior, which the
  # 2x3 matrix above already covers) - kept fast on purpose.
  package-smoke:
    name: Package smoke (clean-room tarball install)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack the real tarball
        run: pnpm pack --out prefix-safe-json-smoke.tgz

      - name: Set up an isolated JS consumer project
        run: |
          mkdir -p /tmp/consumer-js
          cp prefix-safe-json-smoke.tgz /tmp/consumer-js/
          cd /tmp/consumer-js
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./prefix-safe-json-smoke.tgz

      - name: JS clean-room smoke — import and exercise a Stable API
        run: |
          cat > /tmp/consumer-js/smoke.mjs <<'EOF'
          import { createParser, createToolCallExecutionGate } from "prefix-safe-json";
          const parser = createParser();
          const result = parser.push('{"a":1}');
          if (result.syntax !== "root_complete") throw new Error("parser smoke failed: " + JSON.stringify(result));
          const gate = createToolCallExecutionGate();
          if (typeof gate.finish !== "function") throw new Error("gate smoke failed: missing finish()");
          console.log("JS package smoke: OK");
          EOF
          node /tmp/consumer-js/smoke.mjs

      - name: JS clean-room smoke — createAiSdkExecutionLock (Experimental), from the real packed tarball
        run: |
          cat > /tmp/consumer-js/smoke-lock.mjs <<'EOF'
          import { createAiSdkExecutionLock } from "prefix-safe-json";

          const locked = createAiSdkExecutionLock({
            write_file: {
              description: "writes a file",
              inputSchema: { type: "object" },
              someOtherField: 42,
              execute: async () => "should never run",
              onInputStart: () => {},
              onInputDelta: () => {},
              onInputAvailable: () => {},
              needsApproval: false,
            },
          });
          if ("execute" in locked.write_file) throw new Error("execute not removed");
          if ("onInputStart" in locked.write_file) throw new Error("onInputStart not removed");
          if ("onInputDelta" in locked.write_file) throw new Error("onInputDelta not removed");
          if ("onInputAvailable" in locked.write_file) throw new Error("onInputAvailable not removed");
          if (locked.write_file.needsApproval !== true) throw new Error("needsApproval not forced true");
          if (locked.write_file.description !== "writes a file") throw new Error("description not preserved");
          if (locked.write_file.someOtherField !== 42) throw new Error("ordinary metadata not preserved");

          let rejectedDescription = false;
          try {
            createAiSdkExecutionLock({ x: { description: () => "d", inputSchema: {} } });
          } catch (error) {
            rejectedDescription = /function-valued "description"/.test(error.message);
          }
          if (!rejectedDescription) throw new Error("function-valued description was not rejected");

          let rejectedProvider = false;
          try {
            createAiSdkExecutionLock({ x: { type: "provider", id: "openai.web_search", args: {}, isProviderExecuted: true } });
          } catch (error) {
            rejectedProvider = /is provider-executed/.test(error.message);
          }
          if (!rejectedProvider) throw new Error("provider-executed tool was not rejected");

          let rejectedAmbiguous = false;
          try {
            createAiSdkExecutionLock({ x: { type: "provider", id: "openai.web_search", args: {} } });
          } catch (error) {
            rejectedAmbiguous = /no isProviderExecuted flag/.test(error.message);
          }
          if (!rejectedAmbiguous) throw new Error("ambiguous provider shape was not rejected");

          console.log("JS package smoke — createAiSdkExecutionLock: OK");
          EOF
          node /tmp/consumer-js/smoke-lock.mjs

      - name: Set up an isolated TS consumer project
        run: |
          mkdir -p /tmp/consumer-ts
          cp prefix-safe-json-smoke.tgz /tmp/consumer-ts/
          cd /tmp/consumer-ts
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./prefix-safe-json-smoke.tgz typescript@5.9.3 @types/node@22

      - name: TS clean-room smoke — write the representative-usage and execution-lock source files
        run: |
          cat > /tmp/consumer-ts/smoke.ts <<'EOF'
          import { createToolCallExecutionGate, type ExecutionReason } from "prefix-safe-json";
          function describe(reason: ExecutionReason): string {
            switch (reason) {
              case "complete": case "truncated": case "malformed": case "resource_limit":
              case "provider_error": case "content_filtered": case "sdk_execution_observed":
              case "schema_invalid": case "unknown": case "stream_incomplete":
                return reason;
            }
          }
          const gate = createToolCallExecutionGate();
          console.log(describe("sdk_execution_observed"), gate.finish().decisions.length);
          EOF
          cat > /tmp/consumer-ts/smoke-lock.ts <<'EOF'
          import { createAiSdkExecutionLock, type LockedAiSdkTool, type LockedAiSdkTools } from "prefix-safe-json";

          const locked = createAiSdkExecutionLock({
            write_file: {
              description: "writes a file",
              inputSchema: {},
              execute: async () => {},
              onInputStart: () => {},
              onInputDelta: (_o: { inputTextDelta: string }) => {},
              onInputAvailable: (_o: { input: unknown }) => {},
              needsApproval: false,
            },
          });

          // needsApproval's type is the literal `true`, not `boolean`.
          const approvalIsLiteralTrue: true = locked.write_file.needsApproval;
          void approvalIsLiteralTrue;

          // The four removed fields do not exist on the locked type at all.
          // @ts-expect-error - execute is removed by createAiSdkExecutionLock
          const _execute = locked.write_file.execute;
          void _execute;
          // @ts-expect-error - onInputStart is removed by createAiSdkExecutionLock
          const _onInputStart = locked.write_file.onInputStart;
          void _onInputStart;
          // @ts-expect-error - onInputDelta is removed by createAiSdkExecutionLock
          const _onInputDelta = locked.write_file.onInputDelta;
          void _onInputDelta;
          // @ts-expect-error - onInputAvailable is removed by createAiSdkExecutionLock
          const _onInputAvailable = locked.write_file.onInputAvailable;
          void _onInputAvailable;

          // LockedAiSdkTool<T> and LockedAiSdkTools<TTools> are importable and
          // usable standalone as type annotations from the real packed .d.ts.
          interface RawTool {
            description: string;
            execute: () => void;
            needsApproval: boolean;
          }
          type Locked = LockedAiSdkTool<RawTool>;
          const single: Locked = { description: "d", needsApproval: true };
          const many: LockedAiSdkTools<{ tool: RawTool }> = { tool: single };
          console.log(many.tool.needsApproval);
          EOF

      - name: TS clean-room smoke — compile both against the built .d.ts (Stable + Experimental)
        run: |
          cat > /tmp/consumer-ts/tsconfig.json <<'EOF'
          { "compilerOptions": { "target": "ES2022", "module": "NodeNext", "moduleResolution": "NodeNext", "strict": true, "noEmit": true }, "include": ["smoke.ts", "smoke-lock.ts"] }
          EOF
          cd /tmp/consumer-ts && ./node_modules/.bin/tsc --noEmit -p tsconfig.json && echo "TS package smoke: OK"

  dependency-review:
    name: Dependency Review
    # PRs only - there is no "diff" to review on a direct push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Catch newly-introduced risk in this PR's dependency diff, not
          # pre-existing devDependency advisories already present on main -
          # those are tracked separately (see the scheduled dependency audit
          # workflow) and would otherwise make every unrelated PR fail.
          fail-on-severity: high
          # Left at "never" (rather than the action's own "on-failure"
          # default) deliberately: posting a PR comment needs
          # `pull-requests: write`, and this job only holds `contents: read`.
          # The failed check itself is already the visible signal.
          comment-summary-in-pr: never
