name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["18", "20", "22"]

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm run typecheck

    - name: Lint
      run: pnpm run lint --max-warnings=0

    - name: Run Tests
      run: pnpm run test

    - name: Build
      run: pnpm run build

    - name: Run end-to-end example (Anthropic)
      run: pnpm run example:anthropic

    - name: Run end-to-end example (AI SDK execution gate)
      run: pnpm run example:ai-sdk

    - name: Pack Check
      run: pnpm run pack:check
