name: Publish to npm

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"

# Default to read-only; only the `publish` job below needs anything more,
# and it declares its own job-level permissions block instead of relying
# on this one (a job-level `permissions:` replaces the top-level one for
# that job rather than adding to it).
permissions:
  contents: read

jobs:
  # Cheap first gate. This workflow triggers on any push to main that
  # touches package.json, which includes edits that don't change the
  # version at all (a devDependency bump, a script tweak) or that bump it
  # to a version already published (e.g. a re-push after a failed release
  # PR). Before this job existed, that "should this actually run"
  # determination only happened deep inside `publish`, AFTER the full 3x3
  # matrix, coverage, mutation testing (~30 min), and the 10+ minute
  # release-fuzz gate had all already run to completion for nothing. This
  # job does only a checkout and a single `npm view` lookup, and every
  # expensive job below is now conditional on its result.
  release-intent:
    name: Release intent
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Deliberately does NOT treat every non-zero `npm view` result as
      # "unpublished" - that would fail OPEN on a registry timeout/network
      # blip/auth hiccup, letting an unverifiable state slide straight into
      # a full release run. `npm view <pkg>@<version> --json` puts a
      # structured `{"error":{"code":...}}` on stdout (confirmed
      # empirically, separately from the human-readable text npm also
      # writes to stderr) whenever it fails, so the exact npm-reported
      # error code is checked directly:
      #   - exit 0                          -> version exists -> should_publish=false
      #   - exit != 0, error.code == "E404" -> registry confirms no such
      #                                         version -> should_publish=true
      #   - exit != 0, anything else (network/timeout/auth/unexpected)
      #                                      -> FAIL this job. Do not guess.
      - name: Check whether the local version is unpublished
        id: check
        run: |
          set +e
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          NPM_STDOUT=$(npm view "prefix-safe-json@$LOCAL_VERSION" version --json 2>/tmp/npm-view-stderr.log)
          NPM_EXIT=$?
          set -e

          if [ "$NPM_EXIT" -eq 0 ]; then
            echo "Version $LOCAL_VERSION is already published; skipping the release workflow."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERROR_CODE=$(printf '%s' "$NPM_STDOUT" | node -e '
            let data = "";
            process.stdin.on("data", (d) => { data += d; });
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(data);
                process.stdout.write((parsed.error && parsed.error.code) || "");
              } catch {
                process.stdout.write("");
              }
            });
          ')

          if [ "$ERROR_CODE" = "E404" ]; then
            echo "Version $LOCAL_VERSION is not published yet (npm E404 - confirmed, not assumed)."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::npm lookup for prefix-safe-json@$LOCAL_VERSION failed with an unexpected error (code: '${ERROR_CODE:-<none>}', not E404). Failing closed - NOT assuming this version is unpublished."
          echo "--- npm stderr ---"
          cat /tmp/npm-view-stderr.log
          exit 1

  # Duplicated from ci.yml rather than referenced across workflow files on
  # purpose: `needs:` only works between jobs in the SAME workflow file, and
  # the alternative (a `workflow_run` trigger watching ci.yml) resolves the
  # workflow file from the default branch rather than the pushed commit and
  # has no guaranteed ordering against this push's own ci.yml run - both are
  # real gotchas for what is meant to be an unambiguous npm-publish gate.
  # This job is that gate: every OS/Node combination must pass before
  # `publish` (needs: [release-intent, test-matrix, coverage, mutation-test,
  # release-fuzz], below) is even considered. Skipped entirely (not failed)
  # when release-intent determines nothing needs publishing.
  test-matrix:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: release-intent
    if: needs.release-intent.result == 'success' && needs.release-intent.outputs.should_publish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Active LTS lines only - see ci.yml's matrix for why.
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint --max-warnings=0

      - name: Run Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Run end-to-end example (Anthropic)
        run: pnpm run example:anthropic

      - name: Run end-to-end example (AI SDK execution gate)
        run: pnpm run example:ai-sdk

      - name: Run end-to-end example (AI SDK execution guard)
        run: pnpm run example:ai-sdk-guard

      - name: Pack Check
        run: pnpm run pack:check

  # Split out from test-matrix's 9-leg matrix for the same reason as
  # ci.yml's coverage job: v8 instrumentation on 9 legs bought no
  # meaningful extra signal here (nothing under test is platform-
  # conditional) and multiplied the run cost ninefold for nothing. One
  # dedicated run, still required before publish.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: release-intent
    if: needs.release-intent.result == 'success' && needs.release-intent.outputs.should_publish == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests (with coverage)
        run: pnpm run test:coverage

  # Runs in parallel with test-matrix (not chained after it) so this gate
  # adds ~its own runtime to the release, not test-matrix's runtime plus
  # its own. A single Linux/Node runner, not the 3x3 matrix - mutation
  # testing reruns the suite per-mutant, so multiplying that by 9 platform
  # legs would buy essentially no extra signal for a large, avoidable time
  # cost. See this workstream's report for the measured runtime this
  # timeout is sized against.
  mutation-test:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: release-intent
    if: needs.release-intent.result == 'success' && needs.release-intent.outputs.should_publish == 'true'
    permissions:
      contents: read
    # Measured locally at ~30.5 minutes for a full run against the current
    # break:85.01 config (2185 killed / 294 survived / 52 timeout / 8
    # no-coverage mutants across 10 mutated files, 88.11% score - above the
    # threshold, so the job exits 0). 60 minutes leaves real headroom for a
    # shared/slower CI runner without tuning the cap to the exact observed
    # number.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation testing
        # RELEASE.md requires "mutation testing... score > 85%".
        # stryker.config.json's thresholds.break: 85.01 enforces exactly
        # that (Stryker's break check is "score < break fails", so 85.01
        # is the smallest value making "score >= break" equivalent to
        # RELEASE.md's strict ">85" at the precision Stryker compares at -
        # see stryker.config.json for the full reasoning). This step - and
        # therefore this job, and therefore `publish`, which needs it -
        # fails whenever a real mutation run comes in at or below that bar,
        # not merely when Stryker itself errors out.
        run: pnpm run test:mutate

  # RELEASE.md's own checklist: "Run `npm run test:fuzz` for 10+ minutes."
  # That is a wall-clock instruction, not a fixed iteration count - each
  # `test:fuzz` invocation draws a fresh random seed (no seed is pinned in
  # test/fuzz/fast-check.test.ts), so this loops the real command for as
  # long as it takes to clear 600s of actual elapsed time, however many
  # iterations that turns out to be on the runner of the day, rather than
  # guessing a fixed count that might fall short on a slower shared runner.
  # Single Linux/Node runner, in parallel with test-matrix/mutation-test -
  # mutation testing already dominates release latency (~30 min measured),
  # so a ~10-15 min fuzz job alongside it should not extend the critical
  # path.
  release-fuzz:
    name: Release fuzz gate (10+ minutes)
    runs-on: ubuntu-latest
    needs: release-intent
    if: needs.release-intent.result == 'success' && needs.release-intent.outputs.should_publish == 'true'
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test:fuzz for 10+ minutes
        run: |
          set -e
          START=$(date +%s)
          TARGET=600
          i=0
          while :; do
            i=$((i + 1))
            ELAPSED=$(( $(date +%s) - START ))
            echo "=== release-fuzz iteration $i (elapsed ${ELAPSED}s / target ${TARGET}s) ==="
            pnpm run test:fuzz
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$TARGET" ]; then
              echo "=== reached ${ELAPSED}s (>= ${TARGET}s target) after $i iterations ==="
              break
            fi
          done

  publish:
    needs: [release-intent, test-matrix, coverage, mutation-test, release-fuzz]
    # Written out explicitly against each needed job's own `.result`
    # (never relying on the implicit "all needs succeeded" default a job
    # gets when it has NO if: of its own) precisely because this job DOES
    # define a custom if: below - and once a job has any if:, GitHub
    # Actions stops applying that implicit check automatically, making an
    # unchecked custom if: exactly the shape of bug that could let a
    # skipped or failed gate slide through unnoticed. `result` is
    # distinctly "skipped" (not "success") for the four jobs above when
    # release-intent said should_publish=false, so this also naturally
    # skips `publish` in that case without needing separate handling.
    if: |
      needs.release-intent.result == 'success' &&
      needs.release-intent.outputs.should_publish == 'true' &&
      needs.test-matrix.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.mutation-test.result == 'success' &&
      needs.release-fuzz.result == 'success'
    runs-on: ubuntu-latest
    # Separates "a version-changing commit landed on main" (which the four
    # jobs above already validate fully and automatically, on every push -
    # useful even for an accidental version bump, since it's free signal
    # about whether a release would actually be safe) from "a human
    # authorized THIS specific npm publish". Without this, those two things
    # were the same event: any push to main that happened to change
    # package.json's version to something not yet on npm - intentional
    # release or not - published automatically the moment CI passed.
    # `environment: npm-publish` requires a manual approval in the Actions
    # UI before this job (and only this job - release-intent/test-matrix/
    # coverage/mutation-test/release-fuzz above are unaffected and still run
    # automatically) is allowed to start, regardless of how many of its
    # `needs:` already succeeded.
    environment: npm-publish
    # id-token: write is scoped to this job only (not the top-level block,
    # which the other jobs also would have inherited) - it's the OIDC
    # permission npm's `--provenance` flag needs to obtain a Sigstore-signed
    # attestation at publish time, and only the publish step ever runs.
    # contents: write is scoped here too (not at the top level) because
    # this job's own "Tag the release" step needs to push a tag - test-matrix
    # and mutation-test never touch repository contents and stay read-only.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This is the SECOND exact-version check, not the only one -
      # release-intent (top of this file) already made the same
      # determination before the expensive matrix/coverage/mutation/fuzz
      # gates ran, specifically so a version that's already published
      # never pays for any of that. This one exists for a different
      # reason: those gates can take upwards of 30 minutes, during which
      # someone could publish this exact version by another route (a
      # manual `npm publish`, a concurrent/retried run of this same
      # workflow). Re-checking here, immediately before the real
      # `npm publish` call below, is what actually closes that window -
      # the preflight result alone is stale by the time execution reaches
      # this point. Uses the identical fail-closed E404-vs-anything-else
      # distinction as release-intent's check (see there for why every
      # non-zero `npm view` result is not treated as "unpublished").
      - name: Check whether the local version is unpublished (pre-publish recheck)
        id: version-check
        run: |
          set +e
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          NPM_STDOUT=$(npm view "prefix-safe-json@$LOCAL_VERSION" version --json 2>/tmp/npm-view-stderr.log)
          NPM_EXIT=$?
          set -e

          if [ "$NPM_EXIT" -eq 0 ]; then
            echo "Version $LOCAL_VERSION is already published (published since release-intent's check ran); skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERROR_CODE=$(printf '%s' "$NPM_STDOUT" | node -e '
            let data = "";
            process.stdin.on("data", (d) => { data += d; });
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(data);
                process.stdout.write((parsed.error && parsed.error.code) || "");
              } catch {
                process.stdout.write("");
              }
            });
          ')

          if [ "$ERROR_CODE" = "E404" ]; then
            echo "Version $LOCAL_VERSION is still not published (npm E404 - confirmed, not assumed)."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::npm lookup for prefix-safe-json@$LOCAL_VERSION failed with an unexpected error (code: '${ERROR_CODE:-<none>}', not E404). Failing closed - NOT assuming this version is unpublished, NOT proceeding to publish."
          echo "--- npm stderr ---"
          cat /tmp/npm-view-stderr.log
          exit 1

      # test-matrix (needs:, above) already verified typecheck/lint/test
      # pass on every supported Node version and OS - that part really is
      # redundant to repeat here. Build is NOT: this job runs on its own
      # fresh runner with its own checkout, and `dist/` is gitignored, so
      # nothing test-matrix's runners produced ever reaches this one. Skip
      # this step and `npm publish` packs a `dist/`-less tarball - exactly
      # what happened the first time this workflow shipped without it.
      - name: Typecheck
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run lint --max-warnings=0

      - name: Test
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run test

      - name: Build
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run build

      - name: Run end-to-end example (Anthropic)
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run example:anthropic

      - name: Run end-to-end example (AI SDK execution gate)
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run example:ai-sdk

      - name: Run end-to-end example (AI SDK execution guard)
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run example:ai-sdk-guard

      - name: Pack check
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm run pack:check

      # Distinguishes what actually ships (this package's one runtime
      # dependency, ajv) from devDependency-only advisories, which are
      # tracked separately (see the scheduled dependency-audit workflow)
      # and must never block a release on their own. A real production
      # vulnerability, unlike those, genuinely should stop a publish.
      - name: Production dependency audit
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm audit --prod --audit-level=high

      # The exact bug this step exists to catch: `npm publish` packs
      # whatever is in THIS job's own working directory, which shares
      # nothing with test-matrix's runners (needs:, above). A future
      # regression in this job's own `Build` step - or a build config
      # change, a cache issue, anything - would still pass every check
      # above, since none of them install the packed tarball into a
      # separate project the way a real consumer would. This does exactly
      # that, against the literal tarball about to be published.
      - name: Installed-tarball import smoke test
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          echo "Packed: $TARBALL"

          SMOKE_DIR="$(mktemp -d)"
          cp "$TARBALL" "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "./$TARBALL"

          cat > smoke.mjs <<'EOF'
          import {
            createParser,
            createToolCallStreamCoordinator,
            createToolCallExecutionGate,
            createAiSdkExecutionGuard,
            createAiSdkExecutionLock,
          } from 'prefix-safe-json';

          const exportsToCheck = {
            createParser,
            createToolCallStreamCoordinator,
            createToolCallExecutionGate,
            createAiSdkExecutionGuard,
            createAiSdkExecutionLock,
          };
          for (const [name, value] of Object.entries(exportsToCheck)) {
            if (typeof value !== 'function') {
              throw new Error(`installed package is missing export: ${name}`);
            }
          }

          const parser = createParser();
          parser.push('{"path":"a.md","content":"hi"}');
          const result = parser.finish();
          if (result.outcome !== 'valid') {
            throw new Error(
              `expected a valid parse from the installed package, got outcome=${result.outcome}`,
            );
          }

          // createAiSdkExecutionLock (Experimental): exercise the real
          // packed export, not just check it exists as a function.
          const locked = createAiSdkExecutionLock({
            write_file: {
              description: 'writes a file',
              inputSchema: {},
              execute: async () => 'should never run',
              onInputStart: () => {},
              onInputDelta: () => {},
              onInputAvailable: () => {},
              needsApproval: false,
            },
          });
          for (const field of ['execute', 'onInputStart', 'onInputDelta', 'onInputAvailable']) {
            if (field in locked.write_file) {
              throw new Error(`installed createAiSdkExecutionLock did not remove "${field}"`);
            }
          }
          if (locked.write_file.needsApproval !== true) {
            throw new Error('installed createAiSdkExecutionLock did not force needsApproval: true');
          }
          let rejectedFunctionDescription = false;
          try {
            createAiSdkExecutionLock({ x: { description: () => 'd', inputSchema: {} } });
          } catch (error) {
            rejectedFunctionDescription = /function-valued "description"/.test(error.message);
          }
          if (!rejectedFunctionDescription) {
            throw new Error('installed createAiSdkExecutionLock did not reject a function-valued description');
          }
          let rejectedAmbiguousProvider = false;
          try {
            createAiSdkExecutionLock({ x: { type: 'provider', id: 'openai.web_search', args: {} } });
          } catch (error) {
            rejectedAmbiguousProvider = /no isProviderExecuted flag/.test(error.message);
          }
          if (!rejectedAmbiguousProvider) {
            throw new Error('installed createAiSdkExecutionLock did not reject an ambiguous provider shape');
          }

          console.log('OK: installed tarball imports and a real parse round-trips, createAiSdkExecutionLock locks and rejects correctly');
          EOF

          node smoke.mjs

      # A prerelease version (anything with a `-` per semver, e.g.
      # "0.0.1-alpha.3") must never claim the "latest" dist-tag - that tag is
      # what a bare `npm install prefix-safe-json` resolves to, and an alpha
      # build becoming every new user's default install is exactly the
      # failure mode this step exists to prevent. Stable versions (no `-`)
      # keep tagging "latest" as before.
      - name: Determine npm dist-tag
        if: steps.version-check.outputs.should_publish == 'true'
        id: dist-tag
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing prep (repository side only - see this
      # workstream's NPM_ACCOUNT_ACTION_REQUIRED note for the npm-website
      # step a human still has to do before this has any effect): npm's
      # OIDC-based Trusted Publishing needs npm CLI >=11.5.1. The Node 22
      # install above may bundle an older npm. Pinned to the exact,
      # verified-published version 11.5.1 (not a `^11.5.1` range) - this is
      # a security-sensitive release job, and an unbounded future 11.x
      # resolution here would mean the exact CLI build doing the publish
      # step can silently change between releases without this file
      # changing. 11.5.1 is npm's own documented minimum for Trusted
      # Publishing support, confirmed to exist on the npm registry
      # (`npm view npm versions`) before being written here. This is
      # harmless either way right now - NODE_AUTH_TOKEN below still
      # authenticates publish exactly as before - it just means the CLI is
      # already Trusted-Publishing-capable the moment the npm-side
      # registration exists, with no further workflow change required here.
      # Bump this pin deliberately (not silently) if a later npm release is
      # ever wanted.
      - name: Ensure npm CLI supports Trusted Publishing (11.5.1)
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm install -g npm@11.5.1

      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          git tag "v${{ steps.version-check.outputs.version }}"
          git push origin "v${{ steps.version-check.outputs.version }}"

      - name: Create GitHub release
        if: steps.version-check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --title "v$VERSION" \
            "${PRERELEASE_FLAG[@]}" \
            --generate-notes
