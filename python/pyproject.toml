[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prefix-safe-json-langchain"
version = "0.1.0"
description = "Fail-closed cutoff guard for LangChain and LangGraph streamed tool calls"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
]
keywords = [
    "langchain",
    "langgraph",
    "tool-calling",
    "streaming",
    "json",
    "ai-agents",
    "execution-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
middleware = [
    "langchain>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/canblmz1/prefix-safe-json"
Repository = "https://github.com/canblmz1/prefix-safe-json"
Issues = "https://github.com/canblmz1/prefix-safe-json/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/psj_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
